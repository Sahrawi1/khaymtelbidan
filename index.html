<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>خيمة البيظان | Khaymt El Bidan</title>
<meta name="description" content="بوابة تفاعلية لتوثيق تراث الصحراء الغربية وموريتانيا والطوارق">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap');

  :root{
    --night:#1B2A45;
    --night-deep:#111c30;
    --sand:#E8DCC0;
    --sand-light:#F4EFE0;
    --copper:#A8562E;
    --copper-bright:#C96A3B;
    --line: rgba(232,220,192,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--night);
    color:var(--sand-light);
    font-family:'Tajawal', sans-serif;
    line-height:1.8;
    overflow-x:hidden;
  }
  h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
  }
  h2,h3,.display{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
  }
  a{color:inherit;text-decoration:none;}

  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:8vh 6vw;
    position:relative;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(169,86,46,0.15), transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(232,220,192,0.02) 40px, rgba(232,220,192,0.02) 41px);
    pointer-events:none;
  }
  .kicker{
    font-size:0.95rem;
    color:var(--copper-bright);
    letter-spacing:0.02em;
    margin-bottom:1.4rem;
  }
  .hero h1{
    font-size:clamp(2.6rem, 7vw, 5rem);
    line-height:1.25;
    max-width:16ch;
  }
  .hero p{
    max-width:42ch;
    margin-top:1.6rem;
    font-size:1.15rem;
    color:rgba(244,239,224,0.75);
  }
  .scroll-hint{
    margin-top:4rem;
    width:1px;
    height:60px;
    background:linear-gradient(var(--copper-bright), transparent);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.3;}
    50%{opacity:1;}
  }

  section{
    padding:10vh 6vw;
    max-width:1100px;
    margin:0 auto;
  }
  .section-head{
    margin-bottom:4rem;
  }
  .section-head .kicker{margin-bottom:0.8rem;}
  .section-head h2{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
  }

  .portals{
    display:grid;
    grid-template-columns: 1.2fr 1fr;
    gap:1.5rem;
  }
  .portal{
    border:1px solid var(--line);
    padding:2.5rem;
    position:relative;
    cursor:pointer;
    transition:border-color 0.3s ease, background 0.3s ease;
  }
  .portal:hover{
    border-color:var(--copper-bright);
    background:rgba(169,86,46,0.06);
  }
  .portal.wide{grid-column:1 / -1;}
  .portal .num{
    font-family:'Aref Ruqaa', serif;
    font-size:0.85rem;
    color:var(--copper-bright);
    display:block;
    margin-bottom:1rem;
  }
  .portal h3{
    font-size:1.6rem;
    margin-bottom:0.9rem;
  }
  .portal .sub{
    color:var(--copper-bright);
    font-size:0.95rem;
    margin-bottom:1rem;
  }
  .portal p{
    color:rgba(244,239,224,0.72);
    font-size:1rem;
  }
  .portal-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.5s ease;
  }
  .portal.open .portal-body{
    max-height:3500px;
    margin-top:1.5rem;
    padding-top:1.5rem;
    border-top:1px solid var(--line);
  }
  .portal-body ul{list-style:none;}
  .portal-body li{
    padding:0.6rem 0;
    border-bottom:1px dashed var(--line);
    color:rgba(244,239,224,0.8);
  }
  .portal-body li:last-child{border-bottom:none;}
  .portal-body li b{color:var(--sand-light);}

  @media (max-width:720px){
    .portals{grid-template-columns:1fr;}
    .portal.wide{grid-column:auto;}
  }

  .quiz-box{
    border:1px solid var(--line);
    padding:3rem;
    background:rgba(17,28,48,0.4);
  }
  .quiz-progress{
    display:flex;
    gap:0.4rem;
    margin-bottom:2.5rem;
  }
  .quiz-progress span{
    flex:1;
    height:3px;
    background:var(--line);
  }
  .quiz-progress span.done{background:var(--copper-bright);}

  .q-text{
    font-size:1.3rem;
    margin-bottom:1.8rem;
    font-weight:700;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:0.8rem;
  }
  .choice{
    text-align:right;
    padding:1rem 1.4rem;
    border:1px solid var(--line);
    background:transparent;
    color:var(--sand-light);
    font-family:'Tajawal', sans-serif;
    font-size:1rem;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .choice:hover{border-color:var(--copper-bright);}
  .choice.correct{border-color:#6b9c5f;background:rgba(107,156,95,0.12);}
  .choice.wrong{border-color:#a85c5c;background:rgba(168,92
